name: Build APK

on:
  push:
    branches: [ "main", "master", "claude/**" ]
    paths-ignore: [ "apk/**", "**.md" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PracticeBoard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PracticeBoard-apk
          path: PracticeBoard.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Доска практики — сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: PracticeBoard.apk
          body: |
            APK приложения «Доска практики» (Android 8.0+).
            Скачай PracticeBoard.apk на телефон и установи (разреши установку из неизвестных источников).
