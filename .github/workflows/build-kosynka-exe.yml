name: Build Kosynka exe

on:
  push:
    branches: [ "main", "master", "claude/**" ]
    paths: [ "kosynka-unity/**", ".github/workflows/build-kosynka-exe.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Unity secrets
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::warning::Нет секретов UNITY_LICENSE, UNITY_EMAIL и UNITY_PASSWORD, сборка .exe пропущена. Как их добавить, написано в kosynka-unity/README.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.license.outputs.ok == 'true'

      # Образ Unity большой, освобождаем место на раннере
      - uses: jlumbroso/free-disk-space@v1.3.1
        if: steps.license.outputs.ok == 'true'
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/cache@v4
        if: steps.license.outputs.ok == 'true'
        with:
          path: kosynka-unity/Library
          key: Library-kosynka-${{ hashFiles('kosynka-unity/Assets/**', 'kosynka-unity/Packages/**', 'kosynka-unity/ProjectSettings/**') }}
          restore-keys: Library-kosynka-

      - uses: game-ci/unity-builder@v4
        if: steps.license.outputs.ok == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: kosynka-unity
          unityVersion: 2022.3.76f1
          targetPlatform: StandaloneWindows64
          buildName: Kosynka
          buildMethod: Kosynka.EditorTools.BuildScript.BuildWindows

      - name: Pack zip
        if: steps.license.outputs.ok == 'true'
        run: cd build/StandaloneWindows64 && zip -qr "$GITHUB_WORKSPACE/Kosynka-Windows.zip" .

      - uses: actions/upload-artifact@v4
        if: steps.license.outputs.ok == 'true'
        with:
          name: Kosynka-Windows
          path: Kosynka-Windows.zip

      - name: Publish release
        if: steps.license.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kosynka-${{ github.run_number }}
          name: Масляная косынка для Windows — сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: Kosynka-Windows.zip
          body: |
            Игра «Масляная косынка» для Windows (64 бита), собрана на Unity.
            Распакуй Kosynka-Windows.zip в любую папку и запусти Kosynka.exe.
            Свои картинки для карт клади в папку «Картинки» рядом с Kosynka.exe.
